# Production nginx config for www.ninjawrecks.me
#
# Deployed at: /etc/nginx/sites-available/NinjaWrekcs
#              (symlinked from /etc/nginx/sites-enabled/NinjaWrekcs)
#
# Keep this file in sync with the server. See deploy/README.md for why the
# http -> https redirect is load-bearing and must not be removed.

# Redirect non-www (http and https) to the canonical https://www host
server {
    listen 80;
    listen 443 ssl http2;
    server_name ninjawrecks.me;

    ssl_certificate /etc/letsencrypt/live/ninjawrecks.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ninjawrecks.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.ninjawrecks.me$request_uri;
}

# Plain http on www must redirect to https. Serving the app on both schemes made
# the session cookie Secure flag flip per request, which silently rotated the
# session and produced intermittent 419 "Page Expired" errors on POST.
server {
    listen 80;
    server_name www.ninjawrecks.me;

    # Keep ACME http-01 challenges answerable over plain http
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://www.ninjawrecks.me$request_uri;
    }
}

# Main server block for www — https only
server {
    listen 443 ssl http2;
    server_name www.ninjawrecks.me;
    root /var/www/NinjaWrekcs/public;

    ssl_certificate /etc/letsencrypt/live/ninjawrecks.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ninjawrecks.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    # Stops the browser from ever trying plain http again for this host
    add_header Strict-Transport-Security "max-age=31536000" always;

    index index.php;
    charset utf-8;

    # nginx.conf has `gzip on` but leaves gzip_types commented out, so only
    # text/html was ever compressed.
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Product photos and build assets carry a random filename, so re-uploading
    # a photo always produces a new URL and a cached copy can never go stale.
    # Nothing set Cache-Control before this, so a repeat visitor re-fetched
    # every image on every page view.
    #
    # add_header does not inherit once this block declares any of its own, so
    # the three security headers above are repeated here deliberately.
    location ~* ^/(storage|build)/.+\.(jpg|jpeg|png|gif|webp|avif|svg|ico|css|js|woff2?)$ {
        # One header rather than `expires 1y` plus an add_header, which would
        # emit Cache-Control twice.
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header Strict-Transport-Security "max-age=31536000" always;
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
